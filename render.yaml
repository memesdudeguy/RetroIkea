# Render Blueprint: deploy the FastAPI lobby from repo root -> New Blueprint -> paste this file.
# Service name MUST stay "retro-ikea-lobby" so the public URL matches the one baked into the
# game build (RETRO_IKEA_DEFAULT_LOBBY_URL = https://retro-ikea-lobby.onrender.com).
# Override at runtime per-PC with the RETRO_IKEA_LOBBY_URL env var if you want to fork.
services:
  - type: web
    name: retro-ikea-lobby
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    # Single worker: in-memory lobby sessions must not split across processes.
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: LOBBY_TTL_SEC
        value: "90"
